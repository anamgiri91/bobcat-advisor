# Render deployment blueprint for the Bobcat Advisor backend + database.
#
# The frontend is NOT included here — deploy /frontend separately as a
# Render Static Site: build command `npm run build`, publish directory
# `dist`, and set VITE_API_BASE_URL to this backend's public URL
# (e.g. https://bobcat-advisor-api.onrender.com/api).
#
# Usage: from the repo root, "New +" -> "Blueprint" in the Render dashboard,
# point it at this repo. Render will provision both services below.
#
# Note: no persistent disk here. The ChromaDB index + chunks.jsonl are
# committed to git and baked into the Docker image at build time (see
# backend/Dockerfile's `COPY . .`), so every deploy already has the vector
# index — no disk needed, and disks aren't available on Render's free plan
# anyway. If you later add new review documents and rebuild the index
# locally, just commit the updated backend/data/ and redeploy.
#
# Note: no startCommand here either — Docker-runtime Render services must
# take their start command from the image's own CMD (see backend/Dockerfile
# and backend/scripts/start.sh, which run migrations then start uvicorn).

databases:
  - name: bobcat-advisor-db
    databaseName: bobcat_advisor
    user: bobcat
    plan: free

services:
  - type: web
    name: bobcat-advisor-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bobcat-advisor-db
          property: connectionString
      - key: CHROMA_DB_PATH
        value: data/chroma_db
      - key: CORS_ORIGINS
        sync: false  # set to your deployed frontend URL after it's created