# Render Blueprint: API (Docker) + Postgres + frontend (static site).
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Then set the
# values marked `sync: false` in each service's Environment tab (Render keeps
# them encrypted; or use Secret Files, which app/secrets.py reads from
# /etc/secrets/<NAME>).
#
# Why the database is declared here: the API previously pointed at a
# database from another project via a hand-copied internal hostname
# (dpg-...-a). Internal hostnames only resolve for services in the same
# workspace and region; when that database went away, startup failed with
# "could not translate host name". Declaring it here, in the same region,
# lets Render wire DATABASE_URL itself.
#
# Free plan notes: the API sleeps after ~15 minutes idle (first request then
# takes ~30-60s), and free Postgres databases expire after a limited period
# (check Render's current terms); upgrade either for a demo that must stay up.

databases:
  - name: bobcat-advisor-db
    databaseName: bobcat_advisor
    user: bobcat
    plan: free
    region: oregon

services:
  - type: web
    name: bobcat-advisor-api
    runtime: docker
    region: oregon                # same region as the database
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    # Liveness only: the process is up. /api/health (readiness, with database
    # and model status) is for dashboards and uptime monitors.
    healthCheckPath: /api/health/live
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bobcat-advisor-db
          property: connectionString
      - key: ENVIRONMENT
        value: production

      # Secrets: set in the dashboard (or as Secret Files). Never in this file.
      - key: GEMINI_API_KEY
        sync: false
      # The frontend's URL, e.g. bobcat-advisor-web.onrender.com (https:// is added).
      - key: CORS_ORIGINS
        sync: false
      # Optional: OpenTelemetry export (Grafana Cloud, Honeycomb, a collector...).
      # Put OTEL_EXPORTER_OTLP_HEADERS (auth) in a Secret File, not here.
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      # Optional: USD per 1M input/output tokens per model, for the cost dashboard.
      - key: LLM_PRICES
        sync: false
      # Optional: web search for the Careers tab's resource scout. Without a
      # key it uses the curated list; every link is checked either way.
      - key: SEARCH_PROVIDER
        value: brave
      - key: BRAVE_API_KEY
        sync: false

      # Model IDs live in env vars so a provider deprecation is a config change.
      # Check /api/health?deep=true after changing them.
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: LLM_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_FAST_MODEL
        value: gemini-3.6-flash

      # 512MB free plan: no reranker (~100MB) and the exact timetable search
      # instead of OR-Tools (~85MB); both give the same results here.
      - key: RERANKER_ENABLED
        value: "false"
      - key: TIMETABLE_SOLVER
        value: search
      - key: TRUSTED_PROXY_HOPS
        value: "1"

  - type: web
    name: bobcat-advisor-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # The API's URL + /api, e.g. https://bobcat-advisor-api.onrender.com/api
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
