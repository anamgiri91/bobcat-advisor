# Render deployment blueprint for the Bobcat Advisor backend.
#
# The frontend is NOT included here — deploy /frontend separately as a
# Render Static Site. Set VITE_API_BASE_URL to this backend's public URL,
# for example:
# https://bobcat-advisor-api.onrender.com/api
#
# IMPORTANT:
# We are using the existing Render PostgreSQL instance
# "provenance-guard-db" and the separate logical database
# "bobcat_advisor" inside that instance.
#
# Therefore, this Blueprint does NOT define a `databases:` section.
#
# The DATABASE_URL will be entered manually in the Render service's
# Environment settings after the Blueprint creates the web service.
#
# No persistent disk is used here. The ChromaDB index + chunks.jsonl
# are committed to git and baked into the Docker image at build time.
#
# No startCommand is specified because the Docker image's CMD handles
# migrations and starts uvicorn.

services:
  - type: web
    name: bobcat-advisor-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health

    envVars:
      - key: GROQ_API_KEY
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: CHROMA_DB_PATH
        value: data/chroma_db

      - key: CORS_ORIGINS
        sync: false