# Render deployment blueprint for the Bobcat Advisor backend + database.
#
# The frontend is NOT included here — deploy /frontend separately as a
# Render Static Site (or Vercel/Netlify): build command `npm run build`,
# publish directory `dist`, and set VITE_API_BASE_URL to this backend's
# public URL (e.g. https://bobcat-advisor-api.onrender.com/api).
#
# Usage: from the repo root, "New +" -> "Blueprint" in the Render dashboard,
# point it at this repo. Render will provision both services below.

databases:
  - name: bobcat-advisor-db
    databaseName: bobcat_advisor
    user: bobcat
    plan: free

services:
  - type: web
    name: bobcat-advisor-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bobcat-advisor-db
          property: connectionString
      - key: CHROMA_DB_PATH
        value: data/chroma_db
      - key: CORS_ORIGINS
        sync: false  # set to your deployed frontend URL after it's created
    disk:
      name: chroma-data
      mountPath: /app/data
      sizeGB: 1
    # Runs migrations, then starts the API. The Chroma vector index itself
    # must be built once via a Render shell:
    #   docker compose exec / render shell -> bash scripts/build_index.sh
    # (it persists on the mounted disk across deploys).
    startCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
