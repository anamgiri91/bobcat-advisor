name: Knowledge base refresh

# Re-crawls the official TXST pages (app/kb/sources.json), rebuilds the
# search index, runs the tests and evals, and opens a pull request with the
# changes. Merging the PR ships the refreshed index (it is baked into the
# Docker image). Nothing is published without review.

on:
  schedule:
    - cron: "17 6 * * 1"     # Mondays 06:17 UTC; the registrar source refreshes weekly
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated source ids (blank = all)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed
          key: fastembed-minilm-v1
      - run: pip install -r requirements-dev.txt

      - name: Crawl sources
        run: |
          if [ -n "${{ github.event.inputs.sources }}" ]; then
            python -m app.kb.build --sources "${{ github.event.inputs.sources }}" | tee kb-report.txt
          else
            python -m app.kb.build | tee kb-report.txt
          fi
      - name: Freshness check
        run: python -m app.kb.build --check-freshness | tee -a kb-report.txt
        continue-on-error: true     # reported in the PR; a source with no pages needs its seeds fixed
      - name: Rebuild index (embeds only new or changed chunks)
        run: bash scripts/build_index.sh
      - name: Tests + eval gate
        run: pytest -q
      - name: Knowledge-base eval
        run: python -m evals.run_eval --suite kb | tee -a kb-report.txt

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: kb-refresh
          delete-branch: true
          commit-message: "chore(kb): refresh knowledge base from official TXST pages"
          title: "chore(kb): refresh knowledge base"
          body-path: backend/kb-report.txt
          add-paths: |
            backend/data/kb_chunks.jsonl
            backend/data/kb_dates.jsonl
            backend/data/kb_manifest.json
            backend/data/chunks.jsonl
            backend/data/chroma_db/**
