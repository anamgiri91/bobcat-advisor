name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed
          key: fastembed-minilm-v1
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app evals tests
      - name: Tests + offline eval gate + coverage
        # Includes tests/test_eval_gate.py: router, tools and retrieval
        # metrics must not fall below evals/baseline.json. Coverage below
        # the floor fails the build.
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=90
      - name: Eval report
        if: always()
        run: python -m evals.run_eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: backend/evals/results/

  secrets:
    # Fails the build if a credential is committed anywhere in history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t bobcat-backend ./backend
